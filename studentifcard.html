
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student ID Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .id-card {
            width: 320px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        .header {
            background: #123b75;
            color: white;
            padding: 22px 10px;
        }

        .header h2 {
            font-size: 21px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
        }

        .photo {
            width: 110px;
            height: 110px;
            border: 4px solid #123b75;
            border-radius: 50%;
            margin: 20px auto 12px;
            overflow: hidden;
        }

        .photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .student-name {
            color: #123b75;
            font-size: 22px;
            margin: 8px;
        }

        .course {
            color: gray;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .details {
            text-align: left;
            padding: 0 25px 20px;
        }

        .details p {
            font-size: 14px;
            margin: 12px 0;
            border-bottom: 1px solid #ddd;
            padding-bottom: 8px;
        }

        .details strong {
            color: #123b75;
        }

        .footer {
            background: #123b75;
            color: white;
            padding: 12px;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="id-card">

        <div class="header">
            <h2>ABC COLLEGE</h2>
            <p>OF ENGINEERING AND TECHNOLOGY</p>
            <p>STUDENT IDENTITY CARD</p>
        </div>

        <div class="photo">
            <img src="6314168375931769584.jpg"
                 alt="Student Photo">
        </div>

        <h2 class="student-name">Vipul Tiwari</h2>

        <p class="course">B.Tech - Computer Science Engineering</p>

        <div class="details">
            <p><strong>Student ID:</strong>2392608134</p>
            <p><strong>Roll No:</strong> 134</p>
            <p><strong>Department:</strong> CSE</p>
            <p><strong>Session:</strong> 2026 - 2030</p>
            <p><strong>Blood Group:</strong> O+</p>
            <p><strong>Valid Till:</strong> 2030</p>
        </div>

        <div class="footer">
            <p>Authorized College Identity Card</p>
        </div>

    </div>

</body>
</html>
